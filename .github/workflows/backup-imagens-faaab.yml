name: Backup temporário das imagens FAAAB
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-imagens-faaab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-images:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v4
      - name: Empacotar todas as imagens originais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = sorted(p for p in Path(".").rglob("*") if p.is_file() and ".git" not in p.parts and p.suffix.lower() in {".png",".jpg",".jpeg",".gif",".webp",".avif",".svg",".ico"})
          with ZipFile("FAAAB-todas-imagens.zip", "w", ZIP_DEFLATED) as z:
              for p in paths: z.write(p, p.as_posix())
          print("Total:", len(paths))
          assert len(paths) >= 107, "O backup não contém todas as imagens"
          PY
      - name: Disponibilizar backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-imagens-faaab
          path: FAAAB-todas-imagens.zip
          if-no-files-found: error
          retention-days: 7
