name: Publicar template FAAAB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar insígnias transparentes
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -m pip install --disable-pip-version-check pymupdf
          python scripts/otimizar_escudos_escolas.py
          python scripts/auditar_png.py
          python scripts/preparar_insignias.py
      - name: Sincronizar comandantes do Roblox
        env:
          ROBLOX_OPEN_CLOUD_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_KEY }}
          ROBLOX_GROUP_AUDIT_KEY: ${{ secrets.ROBLOX_GROUP_AUDIT_KEY }}
        run: python scripts/sincronizar_comandos.py
      - name: Vestir e renderizar os avatares R6
        env:
          ROBLOX_OPEN_CLOUD_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ -z "$ROBLOX_OPEN_CLOUD_KEY" ]; then
            echo 'Aguardando a chave Open Cloud para atualizar os modelos.'
            exit 0
          fi
          if ! command -v blender >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq blender
          fi
          python scripts/gerar_retratos_comando.py --snapshot assets/comando/titulares.json
      - name: Validar páginas e catálogo da FAAAB
        run: |
          python scripts/validar_piloto.py
          python -m unittest discover -s tests -p 'test_comandos.py' -v
          node --check assets/faaab-components.js
          node --check assets/site.js
          node --check assets/quadro-comando.js
          node --check assets/quadro-titular.js
          node --check assets/forca-hierarquia.js
      - name: Montar somente o site público
        run: python scripts/montar_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
