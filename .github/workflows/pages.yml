name: Publicar template FAAAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar insígnias transparentes
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -m pip install --disable-pip-version-check pymupdf
          python scripts/otimizar_escudos_escolas.py
          python scripts/auditar_png.py
          python scripts/preparar_insignias.py
      - name: Validar páginas e catálogo da FAAAB
        run: |
          python scripts/validar_piloto.py
          node --check assets/faaab-components.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
